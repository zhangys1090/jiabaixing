[pytest]
asyncio_mode = auto
testpaths = tests
# 统一标记注册（pytest.ini 优先级高于 pyproject.toml 的 [tool.pytest.ini_options]，
# 故所有 marker 在此集中声明，避免 pytest.mark 未知标记告警）。
# 用法：
#   pytest -m "e2e or boundary"   仅跑端到端 + 边界（CI e2e-python 门禁）
#   pytest -m "not slow" -n auto  分层快跑（跳过真实网络/LLM/集成等待）
markers =
    slow: 标记耗时测试（网络/LLM/集成等待），可用于分层快跑 `pytest -m "not slow"`
    unit: 单元测试 — 隔离的单个函数/类测试
    e2e: 端到端测试 — 覆盖完整链路（感知→决策→行动→验证→汇报→进化）
    boundary: 边界场景测试 — 取消/超时/错误恢复/空输入等异常路径
# 注意：旧 addopts 曾强制 --cov=agent --cov-fail-under=60，但 [test] extras 未含 pytest-cov，
# 导致 `pytest -q` 在参数解析即崩溃（exit 4，零测试执行），CI python-test 门禁无法运行。
# 2026-08-02 E2E 验证修复：移除 cov 强制，CI 改为显式按需生成覆盖率（见 backend-ci-cd.yml）。
# 此处仅保留 -ra（展示摘要），不启用 --strict-markers，避免第三方测试自定义 marker 误报失败。
addopts = -ra
