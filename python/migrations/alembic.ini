# Alembic config - Jiabaixing V5.0 persistence migration framework (audit P0-4)
#
# Default target DB is the memory store python/data/memory.db (MemoryStore default).
# Other persistence DBs (trajectory / session_lineage / session_search) currently
# self-heal via CREATE TABLE IF NOT EXISTS; they can be migrated later by adding a
# revision and switching AGENT_DB_URL.
[alembic]
script_location = %(here)s
prepend_sys_path = ..
path_separator = os
sqlalchemy.url = sqlite:///./memory.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
