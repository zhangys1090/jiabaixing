[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiabaixing-agent"
version = "0.1.0"
description = "家百星 Agent Python 后端 — 核心 AI 逻辑"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "litellm>=1.60.0",
    "httpx>=0.28.0",
    "chromadb>=1.0.0",
    "jieba>=0.42.1",
    "sentence-transformers>=3.3.0",
    "apscheduler>=3.11.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "scikit-learn>=1.6.0",
    "python-dotenv>=1.0.0",
    "websockets>=14.0",
    "redis[hiredis]>=5.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-prometheus>=0.49b0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
# 全量测试门禁依赖（CI `pip install -e ".[test]"` 使用）
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
# 兼容别名：保留 dev 旧名，避免外部脚本/文档引用失效
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
