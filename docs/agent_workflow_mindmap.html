      id: 'integration', label: '四、模块交互关系', type: 'l1', category: 'evolution',
      desc: 'EventBus事件驱动 + 依赖注入 + 进化闭环的集成架构',
      children: [
        {
          id: 'eventbus', label: 'EventBus神经中枢', type: 'l2', category: 'evolution',
          desc: '类型安全事件总线，50+事件类型，SQLite持久化+批量写入',
          children: [
            { id: 'evt-input', label: 'user_input', type: 'l3', category: 'perception', desc: 'WebSocket→Scheduler，用户输入分发' },
            { id: 'evt-response', label: 'response_ready', type: 'l3', category: 'output', desc: 'Core→WebSocket，回复输出' },
            { id: 'evt-task', label: 'task_completed', type: 'l3', category: 'execution', desc: 'AgentLoop/Scheduler→EventBus，任务完成通知' },
            { id: 'evt-correction', label: 'user_correction', type: 'l3', category: 'evolution', desc: '外部→Core，用户纠错实时反馈' },
            { id: 'evt-proactive', label: 'proactive_*', type: 'l3', category: 'evolution', desc: 'Scheduler→main.ts，主动交互/日程/简报/关怀' }
          ]
        },
        {
          id: 'dep-chain', label: '核心依赖链', type: 'l2', category: 'decision',
          desc: 'JiabaixingCore(大脑) → AgentLoop/Scheduler/PersonaRules → SkillBridge/MemoryEngine',
          children: [
            { id: 'core-hub', label: 'JiabaixingCore', type: 'l3', category: 'decision', desc: '大脑/协调器，持有所有核心模块引用' },
            { id: 'agentloop-dep', label: 'AgentLoop', type: 'l3', category: 'decision', desc: '依赖SkillBridge+MemoryEngine+InteractionEngine' },
            { id: 'scheduler-dep', label: 'Scheduler', type: 'l3', category: 'decision', desc: '持有PriorityArbiter+SceneRecognizer+EmotionAnalyzer' },
            { id: 'evo-dep', label: 'EvolutionEngine', type: 'l3', category: 'evolution', desc: '独立运行，持有FeedbackCollector+StrategyOptimizer' }
          ]
        },
        {
          id: 'proactive-sys', label: '主动交互系统', type: 'l2', category: 'evolution',
          desc: '双层主动检查：交互调度器 + 主动检查循环',
          children: [
            { id: 'sched-interact', label: '交互调度器', type: 'l3', category: 'evolution', desc: 'scheduleNextInteraction()，基于场景权重的定时交互' },
            { id: 'proactive-loop', label: '主动检查循环', type: 'l3', category: 'evolution', desc: 'startProactiveLoop()，每10min扫描日程/情绪/行为' },
            { id: 'insight-detect', label: '介入机会检测', type: 'l3', category: 'evolution', desc: '5种触发：早安/晚安/深夜/长沉默/负面情绪趋势' },
            { id: 'rich-context', label: '5维记忆上下文', type: 'l3', category: 'memory', desc: '语义检索+用户画像+情绪记忆+近期反馈+任务记忆' }

};

const FLOW_ARROWS = [
  { from: 'receive', to: 'analyze', label: '输入传递', color: '#6ee7b7' },
  { from: 'analyze', to: 'decide', label: '上下文', color: '#93c5fd' },
  { from: 'decide', to: 'execute', label: '执行计划', color: '#fcd34d' },
  { from: 'execute', to: 'output', label: '执行结果', color: '#fca5a5' },
  { from: 'output', to: 'feedback', label: '用户反馈', color: '#c4b5fd' },
  { from: 'feedback', to: 'receive', label: '进化优化', color: '#f9a8d4' },
];

let scale = 0.75;
let panX = 0, panY = 0;
let isDragging = false, dragStartX, dragStartY;
const nodePositions = {};
const container = document.getElementById('canvas-container');
const mindmap = document.getElementById('mindmap');
const tooltip = document.getElementById('tooltip');

function layoutTree(node, x, y, angle, spread, depth, parentAngle) {
  const widths = { root: 220, l1: 180, l2: 140, l3: 120, l4: 100 };
  const w = widths[node.type] || 120;
  const h = node.type === 'root' ? 50 : (node.type === 'l1' ? 40 : 32);
  nodePositions[node.id] = { x, y, w, h, node };

  if (!node.children || node.children.length === 0) return;

  const childCount = node.children.length;
  const baseSpread = depth === 0 ? 360 : (depth === 1 ? 120 : 80);
  const distance = depth === 0 ? 320 : (depth === 1 ? 240 : (depth === 2 ? 190 : 150));
  const startAngle = angle - baseSpread / 2;
  const step = childCount > 1 ? baseSpread / (childCount - 1) : 0;

  node.children.forEach((child, i) => {
    const childAngle = childCount > 1 ? startAngle + step * i : angle;
    const rad = (childAngle * Math.PI) / 180;
    const cx = x + Math.cos(rad) * distance;
    const cy = y + Math.sin(rad) * distance;
    layoutTree(child, cx, cy, childAngle, baseSpread * 0.6, depth + 1, childAngle);
  });
}

function renderTree(node, svgEl) {
  const pos = nodePositions[node.id];
  if (!pos) return;

  const div = document.createElement('div');
  div.className = `node ${node.type} ${node.category || ''}`;
  div.textContent = node.label;
  div.style.left = (pos.x - pos.w / 2) + 'px';
  div.style.top = (pos.y - pos.h / 2) + 'px';
  div.style.width = pos.w + 'px';
  div.style.height = pos.h + 'px';
  div.style.display = 'flex';
  div.style.alignItems = 'center';
  div.style.justifyContent = 'center';
  div.style.textAlign = 'center';
  div.dataset.id = node.id;
  div.dataset.desc = node.desc || '';

  div.addEventListener('mouseenter', (e) => {
    if (div.dataset.desc) {
      tooltip.textContent = div.dataset.desc;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY + 15) + 'px';
    }
  });
  div.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  });
  div.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
  });

  mindmap.appendChild(div);

  if (node.children) {
    node.children.forEach(child => {
      const childPos = nodePositions[child.id];
      if (!childPos) return;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const mx = (pos.x + childPos.x) / 2;
      const my = (pos.y + childPos.y) / 2;
      const dx = childPos.x - pos.x;
      const dy = childPos.y - pos.y;
      const cx1 = pos.x + dx * 0.4;
      const cy1 = pos.y + dy * 0.1;
      const cx2 = pos.x + dx * 0.6;
      const cy2 = pos.y + dy * 0.9;
      path.setAttribute('d', `M${pos.x},${pos.y} C${cx1},${cy1} ${cx2},${cy2} ${childPos.x},${childPos.y}`);
      const lineClass = node.type === 'root' ? 'line-root' : (node.type === 'l1' ? 'line-l1' : (node.type === 'l2' ? 'line-l2' : 'line-l3'));
      path.setAttribute('class', `line-path ${lineClass}`);
      svgEl.appendChild(path);
      renderTree(child, svgEl);
    });
  }
}

function renderFlowArrows(svgEl) {
  FLOW_ARROWS.forEach(arrow => {
    const fromPos = nodePositions[arrow.from];
    const toPos = nodePositions[arrow.to];
    if (!fromPos || !toPos) return;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const dx = toPos.x - fromPos.x;
    const dy = toPos.y - fromPos.y;
    const cx1 = fromPos.x + dx * 0.3;
    const cy1 = fromPos.y + dy * 0.5 - 60;
    const cx2 = fromPos.x + dx * 0.7;
    const cy2 = fromPos.y + dy * 0.5 + 60;
    path.setAttribute('d', `M${fromPos.x},${fromPos.y} C${cx1},${cy1} ${cx2},${cy2} ${toPos.x},${toPos.y}`);
    path.setAttribute('class', 'line-flow');
    path.setAttribute('stroke', arrow.color);
    svgEl.appendChild(path);

    const labelDiv = document.createElement('div');
    labelDiv.className = 'flow-label';
    labelDiv.textContent = arrow.label;
    labelDiv.style.left = ((fromPos.x + toPos.x) / 2 - 20) + 'px';
    labelDiv.style.top = ((fromPos.y + toPos.y) / 2 - 30) + 'px';
    labelDiv.style.color = arrow.color;
    mindmap.appendChild(labelDiv);
  });
}

function init() {
  const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.setAttribute('class', 'lines');
  svgEl.setAttribute('width', '4000');
  svgEl.setAttribute('height', '4000');
  mindmap.appendChild(svgEl);

  layoutTree(MINDMAP_DATA, 2000, 2000, -90, 360, 0, -90);
  renderTree(MINDMAP_DATA, svgEl);
  renderFlowArrows(svgEl);

  panX = container.clientWidth / 2 - 2000 * scale;
  panY = container.clientHeight / 2 - 2000 * scale;
  updateTransform();
}

function updateTransform() {
  mindmap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

function zoomIn() { scale = Math.min(2, scale * 1.2); updateTransform(); }
function zoomOut() { scale = Math.max(0.3, scale / 1.2); updateTransform(); }
function resetView() {
  scale = 0.75;
  panX = container.clientWidth / 2 - 2000 * scale;
  panY = container.clientHeight / 2 - 2000 * scale;
  updateTransform();
}

container.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
});
container.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  updateTransform();
});
container.addEventListener('mouseup', () => { isDragging = false; });
container.addEventListener('mouseleave', () => { isDragging = false; });
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.3, Math.min(2, scale * delta));
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

init();
</script>
