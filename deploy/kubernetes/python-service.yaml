# Python 后端 Service: ClusterIP
# 用途: 为 Gateway 提供 Python 后端访问入口（稳定 DNS: jiabaixing-python:8765）
apiVersion: v1
kind: Service
metadata:
  name: jiabaixing-python
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: python-backend
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - port: 8765
      targetPort: 8765
      name: http
  selector:
    app.kubernetes.io/name: python-backend
    app.kubernetes.io/part-of: jiabaixing
