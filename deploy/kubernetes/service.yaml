apiVersion: v1
kind: Service
metadata:
  name: jiabaixing-redis
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jiabaixing
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
