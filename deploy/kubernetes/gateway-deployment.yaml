# Gateway Deployment: 家百星 TS 网关
# 用途: 运行 Express + WebSocket 网关（前端 + HTTP 入口 + Python Bridge）
# 副本: 2（HPA 可扩缩至 6）
# 镜像: jiabaixing/gateway:latest（CI 填充实际 tag）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiabaixing-gateway
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: jiabaixing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: jiabaixing
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: gateway
          image: jiabaixing/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3111
              name: http
          envFrom:
            - configMapRef:
                name: jiabaixing-config
            - secretRef:
                name: jiabaixing-secrets
          env:
            - name: PYTHON_AGENT_URL
              value: 'http://jiabaixing-python:8765'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3111
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3111
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
