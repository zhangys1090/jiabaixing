# Redis StatefulSet: 家百星缓存服务
# 用途: 提供缓存与队列能力，使用 StatefulSet 保证持久化与稳定网络标识
# 持久化: 10Gi PVC，appendonly 模式开启
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jiabaixing-redis
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: jiabaixing-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: jiabaixing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: jiabaixing
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - 'yes'
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/part-of: jiabaixing
          app.kubernetes.io/managed-by: kubectl
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
