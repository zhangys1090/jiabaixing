# Python 后端 Deployment: 家百星核心 AI 逻辑
# 用途: 运行 Python Agent 后端（litellm + memory + loop + evolution）
# 副本: 2（HPA 可扩缩至 10）
# 镜像: jiabaixing/python-backend:latest（CI 填充实际 tag）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiabaixing-python
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: python-backend
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: python-backend
      app.kubernetes.io/part-of: jiabaixing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-backend
        app.kubernetes.io/part-of: jiabaixing
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: python-backend
          image: jiabaixing/python-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          envFrom:
            - configMapRef:
                name: jiabaixing-config
            - secretRef:
                name: jiabaixing-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
