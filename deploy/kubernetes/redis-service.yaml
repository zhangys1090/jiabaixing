# Redis Service: 家百星缓存服务 ClusterIP
# 用途: 为 Python/Gateway 提供 Redis 访问入口（稳定 DNS: jiabaixing-redis:6379）
apiVersion: v1
kind: Service
metadata:
  name: jiabaixing-redis
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: jiabaixing
