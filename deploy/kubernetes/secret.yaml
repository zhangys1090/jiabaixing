# Secret: 家百星敏感配置（占位符）
# 用途: 部署前必须替换 placeholder 为真实值
# 提示: 生产环境建议使用 SealedSecret 或外部密钥管理（Vault/KMS）
apiVersion: v1
kind: Secret
metadata:
  name: jiabaixing-secrets
  namespace: jiabaixing
  labels:
    app.kubernetes.io/name: jiabaixing-secrets
    app.kubernetes.io/part-of: jiabaixing
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # 部署时替换为真实 LLM API Keys（JSON 数组格式）
  LLM_API_KEYS: 'placeholder'
  # 部署时替换为强随机 JWT 签名密钥（>=32 字节）
  JWT_SECRET: 'placeholder'
  # 部署时替换为真实数据库连接串
  DATABASE_URL: 'placeholder'
