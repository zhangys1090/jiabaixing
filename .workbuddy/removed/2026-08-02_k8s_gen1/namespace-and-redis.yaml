apiVersion: v1
kind: Namespace
metadata:
  name: jiabaixing
  labels:
    app.kubernetes.io/name: jiabaixing
    app.kubernetes.io/version: '5.0.0'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jiabaixing-config
  namespace: jiabaixing
data:
  llm-model: 'deepseek-chat'
  llm-base-url: 'https://api.deepseek.com'
---
apiVersion: v1
kind: Secret
metadata:
  name: jiabaixing-secrets
  namespace: jiabaixing
type: Opaque
stringData:
  llm-api-key: 'CHANGE_ME'
  redis-password: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiabaixing-redis
  namespace: jiabaixing
  labels:
    app: jiabaixing-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiabaixing-redis
  template:
    metadata:
      labels:
        app: jiabaixing-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            [
              'redis-server',
              '--appendonly',
              'yes',
              '--maxmemory',
              '256mb',
              '--maxmemory-policy',
              'allkeys-lru',
            ]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jiabaixing-data
  namespace: jiabaixing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: jiabaixing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
