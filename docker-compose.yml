# 家百星 V5.0 Docker Compose 部署配置
# 架构: Gateway(TS) + Python Backend + Redis
# 水平扩展: docker compose up --scale python-backend=N
version: '3.8'

x-common-env: &common-env
  REDIS_ENABLED: 'true'
  REDIS_HOST: redis
  REDIS_PORT: '6379'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jiabaixing-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiabaixing
      POSTGRES_USER: ${PG_USER:-agent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-jiabaixing}
    ports:
      - '${PG_PORT:-5432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-agent} -d jiabaixing']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: jiabaixing-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

  python-backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${PYTHON_PORT:-8765}:8765'
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${PG_USER:-agent}:${PG_PASSWORD:-jiabaixing}@postgres:5432/jiabaixing
      PYTHONUNBUFFERED: '1'
      AGENT_HOST: '0.0.0.0'
      AGENT_PORT: '8765'
      AGENT_BACKEND: python
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      TRAJECTORY_MAX_ENTRIES: '500'
      TRAJECTORY_MAX_STEPS: '20'
      MAX_LISTENERS_PER_EVENT: '200'
      MEMORY_THRESHOLD_MB: '512'
      MEMORY_MONITOR_INTERVAL: '60'
    env_file:
      - .env
    volumes:
      - python-data:/app/data
      - python-logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; r=urllib.request.urlopen('http://localhost:8765/health'); exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiabaixing-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    ports:
      - '${PORT:-3111}:3111'
    environment:
      <<: *common-env
      NODE_ENV: production
      PORT: '3111'
      AGENT_BACKEND: python
      PYTHON_AGENT_URL: http://python-backend:8765
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
      - gateway-logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const req = http.get('http://localhost:3111/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(5000, () => { req.destroy(); process.exit(1); });",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  gateway-data:
    driver: local
  gateway-logs:
    driver: local
  python-data:
    driver: local
  python-logs:
    driver: local
  redis-data:
    driver: local
  pg-data:
    driver: local
